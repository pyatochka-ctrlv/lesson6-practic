<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подорож до Вежі Чарівника</title>
<style>
:root{
  --bg:#14121c; --panel:#262335; --panel2:#1b1928; --line:#4b4566; --ink:#fff; --muted:#d3cdf0;
  --gold:#ffd23f; --green:#4fd16a; --red:#ff3b3b; --blue:#4aa8ff; --purple:#a66bff; --orange:#ffb347;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060b;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);font-size:24px}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--bg);overflow:hidden;user-select:none}
.hidden{display:none!important}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;cursor:pointer;color:#fff}
.panel{background-color:var(--panel);background-image:var(--tpanel);background-size:64px;image-rendering:auto;border:4px solid #000;box-shadow:inset 0 0 0 4px var(--line),inset 10px 10px 0 rgba(255,255,255,.04),0 6px 0 rgba(0,0,0,.45)}

/* ---------- buttons ---------- */
.btn{font-size:26px;font-weight:800;padding:12px 22px;border:4px solid #000;background:#5a5470;color:#fff;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.22);text-shadow:2px 2px 0 rgba(0,0,0,.5);white-space:nowrap;transition:filter .15s,transform .05s}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:disabled{opacity:.38;cursor:default}
.btn.next{background:#2f9e44}
.btn.think{background:#2f6fd8}
.btn.reveal{background:#8a4fd8}
.btn.fast{background:#d88a1f}
.btn.big{font-size:30px;padding:14px 26px}
.btn.huge{font-size:42px;padding:20px 44px}
.btn.small{font-size:22px;padding:6px 14px}
.btn.ready{background:#e0a812;color:#1d1b2a;text-shadow:none;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes floatUp{0%{transform:translateY(10px);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- top: journey ---------- */
#top{position:absolute;left:16px;top:12px;right:16px;height:304px;display:flex;gap:16px}
#journey{flex:1;position:relative;padding:10px 18px}
.jtitle{font-size:30px;font-weight:900;color:var(--gold);text-shadow:3px 3px 0 #000}
.jtitle small{font-size:20px;color:var(--muted);margin-left:14px;font-weight:700;text-shadow:2px 2px 0 #000}
#bSound{position:absolute;right:16px;top:10px}
#track{position:absolute;left:18px;right:18px;top:56px;bottom:10px}
#paths{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.pbase{stroke:#e9e4ff;stroke-width:6;stroke-dasharray:10 10;opacity:.55}
.plit{stroke:var(--gold);stroke-width:10;filter:drop-shadow(0 0 6px #ffd23f);transition:stroke-dashoffset .3s}
.tile{position:absolute;top:6px;width:164px;height:152px;border:4px solid #000;background:#000;transition:box-shadow .5s}
.tile .scene{width:100%;height:100%;display:block;transition:filter .8s}
.tile.locked .scene{filter:brightness(.4) saturate(.35)}
.tile.cur{box-shadow:0 0 0 4px var(--gold),0 0 26px 4px rgba(255,210,63,.7)}
.tlabel{position:absolute;left:-40px;right:-40px;top:154px;text-align:center;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000;white-space:nowrap}
.tile.locked .tlabel{opacity:.55}
.tile.done .tlabel::before{content:"✓ ";color:var(--green)}
.tile.cur .tlabel{color:var(--gold)}
.fog{position:absolute;inset:-8px;pointer-events:none;transition:opacity 2.6s;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 28% 35%,rgba(235,232,255,.96) 0 28%,transparent 58%),radial-gradient(circle at 72% 62%,rgba(225,222,248,.96) 0 30%,transparent 62%),radial-gradient(circle at 50% 85%,rgba(245,243,255,.92) 0 34%,transparent 66%),rgba(205,200,235,.6);
  filter:blur(5px);animation:fogd 5s ease-in-out infinite alternate}
.fog span{font-size:72px;font-weight:900;color:#6a5aa0;filter:blur(0);text-shadow:0 0 10px #fff}
@keyframes fogd{to{transform:translateX(12px) scale(1.06)}}
#journey.clear .fog{opacity:0}
#journey.clear .tile.tower{animation:tglow 1.2s infinite alternate}
@keyframes tglow{from{box-shadow:0 0 18px 6px rgba(255,210,63,.6)}to{box-shadow:0 0 44px 18px rgba(255,210,63,.95)}}
#mtrav{position:absolute;top:88px;width:48px;height:64px;z-index:5;pointer-events:none}
#mtrav img{width:48px;height:64px;display:block;filter:drop-shadow(0 0 4px #fff) drop-shadow(3px 3px 0 rgba(0,0,0,.5))}

/* ---------- backpack ---------- */
#backpack{width:430px;padding:10px 12px}
.bptitle{font-size:28px;font-weight:900;color:var(--gold);text-shadow:3px 3px 0 #000;margin:2px 0 8px 6px}
#bpSlots{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;height:226px}
.slot{background:#14121c;border:4px solid #000;box-shadow:inset 0 0 0 3px #3b3656;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}
.slot .qm{font-size:40px;color:#4b4566;font-weight:900}
.slot.on{background:#2c2440;cursor:pointer;box-shadow:inset 0 0 0 3px var(--gold)}
.slot b{font-size:17px;letter-spacing:.3px;color:var(--gold)}
.slot b.long{font-size:14px;letter-spacing:0}
.slot i{font-size:16px;font-style:normal;color:#fff}
.slot.pop{animation:pop .5s}

/* ---------- field ---------- */
#field{position:absolute;left:16px;right:16px;top:332px;bottom:12px;padding:10px 18px}
#play,#screen{position:absolute;inset:10px 18px;display:flex;flex-direction:column;gap:8px}
#fhead{height:56px;display:flex;align-items:center;gap:18px;flex:none}
#btitle{font-size:30px;font-weight:900;white-space:nowrap;text-shadow:3px 3px 0 #000}
#btitle .ch{color:var(--gold)}
.blab{font-size:20px;color:var(--muted);white-space:nowrap}
#bbar{flex:1;display:flex;gap:8px;height:30px}
#bbar i{flex:1;background:#0f0e16;border:3px solid #000;box-shadow:inset 0 0 0 2px #4b4566;position:relative;overflow:hidden}
#bbar i::after{content:"";position:absolute;inset:2px;background:repeating-linear-gradient(90deg,#7dff8f 0 12px,#4fd16a 12px 24px);transform:scaleX(0);transform-origin:left;transition:transform .7s}
#bbar i.on::after{transform:scaleX(1)}
#bbar i.cur{box-shadow:inset 0 0 0 2px var(--gold)}
#qcount{font-size:24px;color:var(--muted);white-space:nowrap}
#qtext{flex:none;min-height:56px;font-size:38px;font-weight:900;display:flex;align-items:center;text-shadow:3px 3px 0 #000;line-height:1.15}
#qbody{flex:1;min-height:0;position:relative}
#controls{flex:none;height:80px;display:flex;gap:12px;align-items:center}
#controls .sp{flex:1}
.keys{font-size:20px;color:#8a83ad;font-weight:800;margin-right:4px}

/* feedback */
.fb{font-size:26px;font-weight:700;padding:12px 18px;border:4px solid #000;min-height:72px;line-height:1.28;background:var(--panel2);color:#a9a2cc;box-shadow:inset 0 0 0 3px #3b3656}
.fb:empty::before{content:"🙋 Слухаємо відповідь класу…"}
.fb.ok{background:#174d27;color:#e3ffe8;box-shadow:inset 0 0 0 3px var(--green);animation:pop .35s}
.fb.no{background:#4d3514;color:#fff0d6;box-shadow:inset 0 0 0 3px var(--orange);animation:shake .35s}
.fb.info{background:#14324d;color:#e0f0ff;box-shadow:inset 0 0 0 3px var(--blue)}
.fb.ans{background:#3a2160;color:#f3e9ff;box-shadow:inset 0 0 0 3px var(--purple);animation:pop .35s}

/* options */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{font-size:30px;font-weight:800;text-align:left;padding:14px 22px;background:#3a3552;border:4px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18)}
.opt:hover{filter:brightness(1.2)}
.opt b{color:var(--gold);margin-right:10px}
.opt.right{background:#1f7a37;box-shadow:inset 0 0 0 4px var(--green)}
.opt.bad{background:#7a5014;animation:shake .4s}

/* steppers */
.stepper{display:flex;align-items:center;gap:10px}
.sb{width:76px;height:76px;font-size:48px;font-weight:900;background:#3a3552;border:4px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.2);line-height:1}
.sb:disabled{opacity:.35}
.sv{min-width:230px;height:76px;background:#0f0e16;border:4px solid #000;box-shadow:inset 0 0 0 3px var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;padding:0 14px;white-space:nowrap}
.sv .ax{color:var(--gold)}
.sv b{margin-left:10px}

/* ---------- grids ---------- */
.cgrid{position:relative;flex:none}
.cgrid .lx,.cgrid .lz{position:absolute;font-size:19px;font-weight:800;color:#e9e4ff;display:flex;align-items:center;justify-content:center;text-shadow:2px 2px 0 #000}
.cgrid .z0{color:var(--gold);font-size:22px}
.axn{position:absolute;font-size:26px;font-weight:900;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap;display:flex;align-items:center}
.nb{position:absolute;width:44px;text-align:center;font-weight:900;font-size:26px;line-height:1;color:#fff;background:#0f0e16;border:3px solid #000;padding:4px 0}
.nb b{display:block;color:var(--red);font-size:30px}
.cells{position:absolute;display:grid;border:4px solid #000;box-sizing:content-box;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.cell{border-right:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25);background-image:var(--t);background-size:100% 100%;image-rendering:pixelated}
.cell.ax{box-shadow:inset 0 0 0 999px rgba(255,210,63,.16)}
.cells.click .cell{cursor:pointer}
.cells.click .cell:hover{box-shadow:inset 0 0 0 4px #fff}
.ents{position:absolute;inset:0;pointer-events:none}
.ent{position:absolute;display:flex;align-items:flex-end;justify-content:center;transition:left .38s ease,top .38s ease}
.ent.trav{z-index:4}
.ent.trav img{filter:drop-shadow(0 0 3px #fff) drop-shadow(2px 3px 0 rgba(0,0,0,.45))}
.ent.mid{align-items:center}
.ent.foot{align-items:center}
.ent.foot::after{content:"";width:14px;height:14px;background:rgba(110,70,20,.55);border-radius:2px}
.ent.pred{align-items:center;z-index:3}
.ent.pred span{width:86%;height:86%;border:4px dashed var(--gold);background:rgba(255,210,63,.3);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;text-shadow:2px 2px 0 #000;animation:pulse 1s infinite}
.ent.flash{animation:shake .4s}
.ent.flash img{filter:drop-shadow(0 0 8px #ff3b3b) drop-shadow(0 0 4px #ff3b3b)}
.sign{position:absolute;transform:translate(-50%,-100%);background:#7a4c22;border:3px solid #2b1a08;color:#fff;font-size:22px;font-weight:900;padding:3px 10px;white-space:nowrap;transition:left .38s,top .38s;z-index:6;box-shadow:inset 0 0 0 2px #a8743a,2px 3px 0 rgba(0,0,0,.4)}
.sign b{padding:0 3px}
.sign b.hl{background:var(--gold);color:#1d1b2a;animation:pop .4s}
.particle{position:absolute;width:10px;height:10px;pointer-events:none;z-index:8}

/* ---------- biome 1 ---------- */
.b1{display:flex;gap:28px;height:100%}
.b1c{width:480px;height:480px;flex:none;margin-top:-6px}
.rcomp{width:480px;height:480px;display:block}
.dl{cursor:pointer}
.dlc{fill:#fff3cf;stroke:#1d1b2a;stroke-width:5;transition:fill .2s}
.dl:hover .dlc{fill:#ffe39a}
.dl.found .dlc{fill:#c8f7d0;stroke:#1f7a37;stroke-width:8}
.dl.bad .dlc{fill:#ffc58a}
.dlt{font:900 84px "Trebuchet MS",Arial,sans-serif;fill:#1d1b2a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dlt.n{fill:#e8322f}
.wedge{fill:transparent;transition:fill .5s}
.wedge.front{fill:rgba(255,210,63,.55)}
.wedge.back{fill:rgba(166,107,255,.5)}
.wedge.right{fill:rgba(79,209,106,.5)}
.wedge.left{fill:rgba(74,168,255,.5)}
.b1r{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.b1top{display:flex;gap:20px;flex:1;min-height:0}
.words{display:flex;flex-direction:column;gap:10px;flex:1}
.word{display:flex;align-items:center;gap:16px;background:var(--panel2);border:4px solid #000;box-shadow:inset 0 0 0 3px #3b3656;padding:4px 14px;height:72px}
.word .wl{font-size:46px;font-weight:900;width:50px;text-align:center}
.word .wl.n{color:var(--red)}
.word .we{font-size:42px;font-weight:900;color:var(--gold);min-width:150px}
.word .wu{font-size:30px;flex:1}
.word:not(.on) .we,.word:not(.on) .wu,.word:not(.on) .speak{visibility:hidden}
.word:not(.on){opacity:.5}
.word.on{animation:pop .45s}
.speak{font-size:28px;width:58px;height:54px;background:#2f2b44;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a5470;flex:none}
.speak:hover{filter:brightness(1.3)}
.no-tts .speak{display:none!important}
.rels{flex:1;display:flex;flex-direction:column;gap:10px}
.rtitle{font-size:26px;font-weight:800;color:var(--muted);height:30px}
.rel{font-size:28px;font-weight:800;padding:6px 14px;border:4px solid #000;background:var(--panel2);display:flex;align-items:center;gap:12px;height:64px;transition:background .4s}
.rel .ra{font-size:30px;width:36px;text-align:center}
.rel b{font-size:34px}
.rel i{color:var(--muted);font-style:normal}
.rel.front.on{background:#6b5810}.rel.back.on{background:#4a2c7a}.rel.right.on{background:#1f6a33}.rel.left.on{background:#1d4c78}
.rel.on{animation:pop .4s}

/* ---------- biome 2 ---------- */
.b2{display:flex;gap:34px;height:100%;align-items:flex-start}
.pad{display:grid;grid-template-columns:repeat(3,112px);grid-template-rows:repeat(3,112px);gap:6px;flex:none;margin-top:14px}
.pb{border:4px solid #000;background:#3a3552;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pb:hover{filter:brightness(1.2)}
.pb:active{transform:translateY(3px)}
.pb b{font-size:50px}
.pb span{font-size:20px;font-weight:800}
.pb i{font-size:17px;font-style:normal;color:var(--muted)}
.pb.pN b{color:var(--red)}
.pN{grid-area:1/2}.pW{grid-area:2/1}.pE{grid-area:2/3}.pS{grid-area:3/2}
.pc{grid-area:2/2;display:flex;align-items:center;justify-content:center;font-size:56px}
.running .pb,.running .rbtns .btn{pointer-events:none;opacity:.5}
.rp{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.rlab{font-size:28px;font-weight:900}
.rlab small{font-size:20px;color:var(--muted);font-weight:700}
.route{display:flex;flex-wrap:wrap;gap:12px 6px;min-height:150px;align-content:flex-start;background:#0f0e16;border:4px solid #000;padding:12px 10px 16px}
.rempty{font-size:24px;color:#6f6894;padding:8px}
.rc{position:relative;width:66px;height:58px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;border:3px solid rgba(0,0,0,.45);box-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop .25s}
.rc::after{content:"";position:absolute;bottom:-9px;left:10px;width:16px;height:7px;background:inherit;border:3px solid rgba(0,0,0,.45);border-top:none;border-radius:0 0 5px 5px}
.rc b{font-size:30px;line-height:1}.rc i{font-size:13px;font-style:normal}
.rc.dN{background:#d8413a}.rc.dS{background:#2f7fd8}.rc.dE{background:#2f9e44}.rc.dW{background:#c9821a}
.rc.on{outline:4px solid #fff;transform:translateY(-4px)}
.rc.bad{outline:4px solid var(--orange);animation:shake .4s}
.rbtns{display:flex;gap:12px}
.stats{font-size:26px;font-weight:700}
.stats b{color:var(--gold)}
.drop{position:absolute;left:50%;top:-30px;transform:translateX(-50%);animation:bob 1s infinite}

/* ---------- biome 3 ---------- */
.b3{display:flex;gap:30px;height:100%}
.b3s{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;padding-top:10px}
.b3row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lbl{font-size:28px;font-weight:900}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:pop .35s}
.rule{font-size:26px;font-weight:800;background:var(--panel2);border:4px solid #000;padding:10px 14px}
.rule .ra{display:inline-block;width:40px}
.rule b{color:var(--gold)}
.rule em{font-style:normal;color:var(--green)}
.rule u{text-decoration:none;color:var(--orange)}

/* ---------- biome 4 ---------- */
.b4{display:flex;gap:20px;height:100%}
.b4c{width:340px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.b4ct{font-size:24px;font-weight:900;color:var(--muted)}
.b4lab{font-size:24px;text-align:center;font-weight:700}
.b4lab b{font-size:30px;color:var(--gold)}
.b4m{flex:none;width:620px;height:440px;border:4px solid #000;box-sizing:content-box;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.b4map{display:block}
.mlab{font:900 22px "Trebuchet MS",Arial,sans-serif;fill:#fff;stroke:#1d1b2a;stroke-width:5px;paint-order:stroke;text-anchor:middle}
.cmdt{font:900 24px Consolas,"Courier New",monospace;fill:var(--gold);text-anchor:middle}
.b4s{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- biome 5 ---------- */
.b5{display:flex;gap:26px;height:100%}
.ctable{width:900px;flex:none;border:4px solid #000;background-image:var(--tplanks);background-size:64px;image-rendering:pixelated;padding:10px 18px;box-shadow:inset 0 0 0 4px #c98a4a,0 6px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.cthead{font-size:28px;font-weight:900;text-shadow:3px 3px 0 #000}
.ctrow{display:flex;align-items:center;gap:14px}
.cslot{position:relative;width:136px;height:136px;background:#8b8b8b;border:4px solid #000;box-shadow:inset 4px 4px 0 #373737,inset -4px -4px 0 #fff;display:flex;align-items:center;justify-content:center;flex:none}
.cslot.big{width:250px;height:250px}
.cslot canvas{width:112px;height:112px;border:3px solid #6b5a2a}
.cslot.big canvas{width:220px;height:220px}
.cslot.empty canvas{display:none}
.cslot.empty::after{content:"?";font-size:80px;font-weight:900;color:#5d5d6b}
.cslot.locked{background:#555}
.cslot.locked::after{content:"✕";position:absolute;font-size:90px;color:#ff3b3b;font-weight:900;text-shadow:3px 3px 0 #000}
.sl{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:20px;font-weight:800;text-shadow:2px 2px 0 #000}
.si img{animation:pop .3s}
.sym{font-size:56px;font-weight:900;text-shadow:3px 3px 0 #000}
.items{display:flex;gap:16px;margin-top:22px}
.item{flex:1;display:flex;align-items:center;gap:14px;background:#3a3552;border:4px solid #000;padding:8px 14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.2);text-align:left}
.item:hover{filter:brightness(1.2)}
.item:disabled{opacity:.35;cursor:default;filter:grayscale(1)}
.item b{display:block;font-size:28px}
.item i{display:block;font-size:22px;font-style:normal;color:var(--gold)}
.b5s{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.b5s .opts{display:grid;grid-template-columns:1fr 1fr}
.scalebox{background:var(--panel2);border:4px solid #000;padding:10px 14px}
.sbt{font-size:24px;font-weight:800;color:var(--muted);margin-bottom:6px}
.scales{display:flex;align-items:center;gap:6px}
.scales span{min-width:66px;height:58px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;background:#0f0e16;border:3px solid #000;color:#6f6894;transition:all .3s}
.scales span.on{background:var(--gold);color:#1d1b2a;transform:scale(1.12)}
.scales span.past{color:#fff}
.scales em{font-style:normal;font-size:26px;color:var(--muted)}
.pcount{font-size:26px;font-weight:800;margin-top:6px;min-height:32px}

/* ---------- biome 6 ---------- */
.b6{display:flex;gap:22px;height:100%}

/* вежа (власний дизайн) */
function drawTower(R,N,cx,ground,h,stars){
  const bodyTop=ground-Math.round(h*.6);
  N(cx-6,bodyTop,12,ground-bodyTop,['#8d8d9c','#7b7b8a','#9d9dab','#84849a']);
  for(let y=bodyTop+3;y<ground;y+=4)R(cx-6,y,12,1,'#5d5d6b');

  for(let i=0;i<rh;i++){const w=Math.max(1,Math.round((i+1)/rh*7));R(cx-w,bodyTop-4-rh+i,w*2,1,i%3===0?'#9a6cf0':'#6a3fc1');}

  for(let y=bodyTop+4;y<ground-9;y+=9)R(cx-2,y,4,4,'#ffd23f');
  R(cx-2,ground-6,4,6,'#5a3815');

  const c=document.createElement('canvas');c.width=40;c.height=70;const x=c.getContext('2d');const r=rng(77);

  const N=(a,b,w,h,p)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){x.fillStyle=p[Math.floor(r()*p.length)];x.fillRect(a+i,b+j,1,1);}};
  drawTower(R,N,20,70,68);return _tower=c.toDataURL();

/* сцени біомів для карти подорожі */
function scene(kind){
  const W=41,H=38,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const r=rng(kind.charCodeAt(0)*131+kind.length*7);

let actx=null,muted=false;
function AC(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{actx=new C();}catch(e){return null;}}if(actx.state==='suspended')actx.resume();return actx;}
function tone(f,d,type='square',v=.06,t0=0,f2=0){
  if(muted)return;const a=AC();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}

function makeGrid(o){
  const c=o.cell,nx=o.x1-o.x0+1,nz=o.z1-o.z0+1,LW=o.labels?(o.lw||44):0,LH=o.labels?32:0;
  const el=document.createElement('div');el.className='cgrid';
  el.style.width=(LW+nx*c+8+64)+'px';el.style.height=(LH+nz*c+8+(o.labels?32:0))+'px';
  let h='';
  if(o.labels){
    for(let i=0;i<nx;i++){const v=o.x0+i;h+=`<div class="lx${v===0?' z0':''}" style="left:${LW+4+i*c}px;top:0;width:${c}px;height:${LH}px">${fmt(o.fx?o.fx(v):v)}</div>`;}
    for(let j=0;j<nz;j++){const v=o.z0+j;h+=`<div class="lz${v===0?' z0':''}" style="left:0;top:${LH+4+j*c}px;width:${LW}px;height:${c}px">${fmt(o.fz?o.fz(v):v)}</div>`;}
    h+=`<div class="axn" style="left:${LW+nx*c+14}px;top:0;height:${LH}px">X →</div><div class="axn" style="left:2px;top:${LH+nz*c+10}px">Z ↓</div>`;
  }
  h+=`<div class="nb" style="left:${LW+nx*c+16}px;top:${LH+8}px">↑<b>N</b></div>`;
  h+=`<div class="cells" style="left:${LW}px;top:${LH}px;grid-template-columns:repeat(${nx},${c}px);grid-auto-rows:${c}px;--t:url(${o.tex})">`;
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const x=o.x0+i,z=o.z0+j;h+=`<div class="cell${o.axis&&(x===0||z===0)?' ax':''}" data-x="${x}" data-z="${z}"></div>`;}
  h+='<div class="ents"></div></div>';
  el.innerHTML=h;
  const cells=el.querySelector('.cells'),ents=el.querySelector('.ents');
  const pos=(x,z)=>({left:(x-o.x0)*c,top:(z-o.z0)*c});
  const put=(e,x,z)=>{const p=pos(x,z);e.style.left=p.left+'px';e.style.top=p.top+'px';};
  const jump=(e,x,z)=>{e.style.transition='none';put(e,x,z);void e.offsetWidth;e.style.transition='';};
  const add=(e,x,z)=>{e.style.width=c+'px';e.style.height=c+'px';e.style.transition='none';put(e,x,z);ents.appendChild(e);void e.offsetWidth;e.style.transition='';return e;};
  const inside=(x,z)=>x>=o.x0&&x<=o.x1&&z>=o.z0&&z<=o.z1;
  return{el,cells,ents,pos,put,jump,add,inside,c};
}

  {start:[1,5],chest:[5,1],cacti:[[1,3],[3,1],[4,4]]},
  {start:[1,5],chest:[4,2],cacti:[[1,3],[3,2]]}
];
function bfs(m){
  const key=(x,z)=>x+','+z,blocked=new Set(m.cacti.map(c=>key(...c))),prev={[key(...m.start)]:null},q=[m.start];
  while(q.length){const[x,z]=q.shift();if(x===m.chest[0]&&z===m.chest[1])break;
    for(const d of['N','E','S','W']){const nx=x+DV[d][0],nz=z+DV[d][1],k=key(nx,nz);
      if(nx<0||nz<0||nx>6||nz>6||blocked.has(k)||k in prev)continue;prev[k]={from:key(x,z),d};q.push([nx,nz]);}}
  const path=[];let k=key(...m.chest);while(prev[k]){path.unshift(prev[k].d);k=prev[k].from;}return path;
}
function pathSummary(p){const cnt={};p.forEach(d=>cnt[d]=(cnt[d]||0)+1);return Object.entries(cnt).map(([d,n])=>`${n} на ${DIRS[d].en}`).join(' і ');}

  const g=makeGrid({x0:0,x1:6,z0:0,z1:6,cell:64,tex:TEX.sand});

  const cacEls={};m.cacti.forEach(([x,z])=>{cacEls[x+','+z]=g.add(ent(img('cactus',46,55),'mid'),x,z);});
  const chest=g.add(ent(img('chest',52,43),'mid'),...m.chest);

    const rec=bs.rec[mi];

  };
  const resetPos=()=>{g.jump(tr,...m.start);$$('.foot',g.ents).forEach(f=>f.remove());chest.innerHTML=img('chest',52,43);$$('.rc',body).forEach(c=>c.classList.remove('on','bad'));};
  const add=d=>{if(running)return;if(route.length>=20){api.info('Маршрут дуже довгий! Спробуйте коротший.');return;}route.push(d);sfx.click();resetPos();draw();};
  body.querySelector('.pad').onclick=e=>{const b=e.target.closest('.pb');if(b)add(b.dataset.d);};
  body.querySelector('.rx').onclick=()=>{if(running||!route.length)return;route.pop();sfx.click();resetPos();draw();};
  body.querySelector('.rclr').onclick=()=>{if(running)return;route=[];sfx.click();resetPos();draw();};

  const go=async()=>{
    if(running)return;if(!route.length){api.info('Спершу складіть маршрут: натискайте N, S, W, E!');return;}
    running=true;body.firstElementChild.classList.add('running');resetPos();

    for(let i=0;i<route.length;i++){
      if(!api.alive())return;
      cards.forEach(c=>c.classList.remove('on'));cards[i].classList.add('on');
      const[dx,dz]=DV[route[i]],nx=x+dx,nz=z+dz;
      if(!g.inside(nx,nz)){bump(dx,dz);cards[i].classList.add('bad');result='edge';break;}
      const ce=cacEls[nx+','+nz];
      if(ce){bump(dx,dz);cards[i].classList.add('bad');ce.classList.remove('flash');void ce.offsetWidth;ce.classList.add('flash');result='cactus';break;}
      g.add(ent('','foot'),x,z);x=nx;z=nz;g.put(tr,x,z);sfx.step();await sleep(440);

      if(!bs.rec[mi]||steps<bs.rec[mi])bs.rec[mi]=steps;draw();
      $$('.rc',body).forEach((c,i)=>c.classList.toggle('on',i<steps));
      api.solve(`Ура! Скриня з водою! 💧 Маршрут: ${kroky(steps)}.${steps===short?' Це найкоротший маршрут! 🏆':''}${steps<route.length?' (Решта карток не знадобилась.)':''}`);
    }else if(result==='cactus')api.wrong('Тут кактус! 🌵 Змініть маршрут.');
    else if(result==='edge')api.wrong('Тут край карти! Змініть маршрут.');
    else api.info('Маршрут закінчився, а до скрині ще не дійшли. Додайте напрямки!');
    running=false;body.firstElementChild.classList.remove('running');
  };
  body.querySelector('.rgo').onclick=go;
  draw();
  return{reveal(){if(running)return;route=bfs(m);resetPos();draw();setTimeout(()=>{if(api.alive())go();},500);}};
};}

  bonus:{q:'Яка карта краща для далекої подорожі: з масштабом 1 чи 8? Чому?',a:'Масштаб <b>8</b>! Вона показує більшу територію — видно далекі місця.'},
  questions:B5Q},
 {key:'mount',name:'Гори',icon:'⛰️',title:'Телепорт до Вежі',reward:{en:'TELEPORT',ua:'Телепорт',spr:'portal',say:'Teleport'},
  bonus:{q:'Мандрівник на X = 1, Z = 2. Блок [телепортуватися до ~0 ~0 ~−2]. Куди він потрапить?',a:'<b>X = 1, Z = 0.</b><br>~0 — X не змінюється. ~−2 — Z меншає на 2: 2 − 2 = 0.'},
  questions:[
   {prompt:'Куди потрапить мандрівник після блоку [~3 ~0 ~0]?',answer:'На 3 клітинки на East від того місця, де він стоїть: X + 3, Z той самий.',mount:b6A('rel')},
   {prompt:'А після блоку [2 64 -3]? Куди потрапить мандрівник?',answer:'Завжди в одне місце: X = 2, Z = −3.',mount:b6A('abs')},
   {prompt:'Який блок завжди веде в одне й те саме місце?',options:['[телепортуватися до ~3 ~0 ~0]','[телепортуватися до 2 64 -3]'],answer:'Блок без тильди: [телепортуватися до 2 64 -3].',mount:b6A('quiz')},
   {prompt:'Секретний маршрут! Яким буде X Вежі?',answer:'X = 200 (East — X більшає: 0 + 200).',mount:b6B(0)},
   {prompt:'Яким буде Z Вежі?',answer:'Z = −150 (North — це мінус Z).',mount:b6B(1),
    bonus:{q:'Мандрівник на X = 200, Z = 0. Яку команду з тильдою написати, щоб потрапити до Вежі?',a:'<b>/teleport ~0 ~0 ~-150</b><br>X не міняється, висота та сама, Z меншає на 150 (на North).'}},
   {prompt:'Допишіть команду телепорту: /teleport ___ 64 ___',answer:'/teleport 200 64 -150',mount:b6B(2),
    bonus:{q:'Мандрівник на X = 200, Z = 0. Яку команду з тильдою написати, щоб потрапити до Вежі?',a:'<b>/teleport ~0 ~0 ~-150</b><br>X не міняється, висота та сама, Z меншає на 150 (на North).'}}
  ]}
];
BIOMES[5].questions[3].bonus=BIOMES[5].questions[4].bonus;
/* Простий режим (за замовчуванням, для 8 років): по 1 завданню на біом.
   Повна версія з усіма завданнями: додайте ?full до адреси сторінки. */
const FULL=/[?&]full\b/.test(location.search);
if(!FULL){
  const one=(i,q,bonus)=>{BIOMES[i].questions=[q];BIOMES[i].bonus=bonus;};
  one(0,B1Q[0],{q:'Мандрівник дивиться на North. Що в нього за спиною?',a:'<b>South</b> — Південь! За спиною — протилежна сторона.'});
  one(1,{prompt:'Доведіть мандрівника до скрині! Кажіть лише: North, South, West, East.',maze:2,
    answer:()=>{const p=bfs(MAZES[2]);return `Наприклад: ${p.join(' ')} — ${kroky(p.length)}.`;},mount:b2Mount(2)},BIOMES[1].bonus);
  one(2,BIOMES[2].questions[0],{q:'А якщо мандрівник піде 2 кроки на West? Яким стане X?',a:'<b>X = −2.</b> West — X меншає: 0 − 2 = −2.'});
  one(3,B4Q[0],{q:'Мандрівник натиснув компасом по магнетиту. Куди тепер вказує компас?',a:'На <b>магнетит</b>! Магнетит змінює напрямок компаса.'});
  one(4,B5Q[0],{q:'Що додати до карти, щоб вона показувала більшу територію?',a:'<b>Папір</b>! Карта + папір = більший масштаб.'});
  one(5,BIOMES[5].questions[0],{q:'Який блок завжди веде в одне й те саме місце: [~3 ~0 ~0] чи [2 64 -3]?',a:'Блок <b>без тильди</b> — [2 64 -3]. З тильдою ~ рахуємо від того місця, де стоїш.'});
}
const SKILLS=FULL?[
 'Називаємо сторони горизонту: <b>North, South, West, East</b> — і показуємо їх на компасі.',
 'Прокладаємо маршрут лише напрямками <b>N / S / W / E</b>.',
 'Знаємо, як зміниться координата: <b>East +X, West −X, South +Z, North −Z</b>.',
 'Компас у Minecraft вказує на <b>World Spawn</b>; магнетит змінює його напрямок.',
 'Карта + <b>компас</b> = локатор; карта + <b>папір</b> = більший масштаб (до 4 разів).',
 '<b>~</b> — відносні координати (від того, де стоїш); без ~ — абсолютні (завжди одне місце).'
]:[
 'Називаємо сторони горизонту: <b>North, South, West, East</b> — і показуємо їх на компасі.',
 'Прокладаємо маршрут лише напрямками <b>N / S / W / E</b>.',
 'Знаємо: коли йдемо на <b>East</b>, координата <b>X більшає</b>.',
 'Компас у Minecraft вказує на <b>World Spawn</b> — точку появи світу.',
 'Карта + <b>компас</b> = на карті видно себе (зелена стрілка).',
 '<b>~</b> у команді — рахуємо від того місця, де стоїш.'
];

/* =====================================================================
   СТАН І ПОТІК ГРИ
   ===================================================================== */
const S={screen:'start',b:0,q:0,solved:BIOMES.map(b=>b.questions.map(()=>false)),bs:{},busy:false};
let token=0,cur={},curPrompt='';
const curQ=()=>BIOMES[S.b].questions[S.q];
function setPrompt(t){curPrompt=t;$('#qtext').textContent=t;}
function render(){
  token++;const t=token,B=BIOMES[S.b],Q=curQ();
  $('#btitle').innerHTML=`${B.icon} Біом ${S.b+1}: ${B.name} — <span class="ch">«${B.title}»</span>`;
  $('#bbar').innerHTML=B.questions.map((q,i)=>`<i class="${S.solved[S.b][i]?'on':''}${i===S.q?' cur':''}"></i>`).join('');
  $('#qcount').textContent=`Завдання ${S.q+1} з ${B.questions.length}`;
  setPrompt(Q.prompt);
  const body=$('#qbody');body.innerHTML='';
  const fb=(cls,msg)=>{if(t!==token)return;const el=body.querySelector('.fb');if(!el)return;el.className='fb '+cls;el.innerHTML=msg;};
  const api={body,bs:S.bs,solved:S.solved[S.b][S.q],alive:()=>t===token,fb,
    setPrompt:p=>{if(t===token)setPrompt(p);},
    solve:msg=>{if(t!==token)return;S.solved[S.b][S.q]=true;const bar=$$('#bbar i')[S.q];if(bar)bar.classList.add('on');
      const all=S.solved[S.b].every(Boolean);
      fb('ok','✅ '+msg+(all?(S.b<5?'<br>🎉 Біом пройдено! Тисніть «В дорогу!»':'<br>🏰 Тисніть «До Вежі!»'):''));sfx.ok();updateNav();},
    wrong:msg=>{fb('no','🤔 '+msg);sfx.no();},
    info:msg=>fb('info',msg)};
  cur=Q.mount(api)||{};
  if(api.solved&&!body.querySelector('.fb.ok'))fb('ok','✅ Це завдання вже пройдено! Можна спробувати ще раз.');
  updateNav();updateMap();
}
function updateNav(){
  if(S.screen!=='play')return;
  $('#bBack').disabled=S.q===0;
  const all=S.solved[S.b].every(Boolean),n=$('#bNext');
  n.classList.toggle('ready',all);n.textContent=all?(S.b===5?'🏰 До Вежі! →':'🚶 В дорогу! →'):'Далі →';
}
function next(){
  if(S.busy)return;
  if(S.screen==='start'){startGame();return;}
  if(S.screen!=='play')return;
  const B=BIOMES[S.b];
  if(S.solved[S.b].every(Boolean)){completeBiome();return;}
  if(S.q<B.questions.length-1){S.q++;sfx.click();render();}
  else{const k=S.solved[S.b].findIndex(v=>!v);S.q=k;render();toast(`Ще не все пройдено: завдання ${k+1}`);}
}
function back(){if(S.busy||S.screen!=='play'||S.q===0)return;S.q--;sfx.click();render();}
function resetBiome(){if(S.busy||S.screen!=='play')return;S.solved[S.b]=S.solved[S.b].map(()=>false);S.bs={};S.q=0;render();toast('↺ Біом скинуто. Пробуємо ще раз!');}
function revealAnswer(){
  if(S.busy||S.screen!=='play')return;const Q=curQ();const a=typeof Q.answer==='function'?Q.answer():Q.answer;
  const el=$('#qbody .fb');if(el){el.className='fb ans';el.innerHTML='👀 Відповідь: '+a;}
  sfx.click();if(cur.reveal)cur.reveal();
}
function showThink(){
  if(S.busy||S.screen!=='play')return;const Q=curQ();
  openOv(`<div class="ovh">🤔 Як думаєте?</div><div class="ovq">${curPrompt}</div>${Q.options?`<div class="ovopts">${Q.options.map(o=>`<div>${o}</div>`).join('')}</div>`:''}<div class="ovhint">Подумайте і скажіть відповідь голосом! 🙋</div><button class="btn ovx">Закрити ✕</button>`);
  sfx.click();
}
function showFast(){
  if(S.busy||S.screen!=='play')return;const Q=curQ(),bn=Q.bonus||BIOMES[S.b].bonus,a=typeof bn.a==='function'?bn.a():bn.a;
  openOv(`<div class="ovh fast">⚡ Для швидких</div><div class="ovq" style="font-size:52px">${bn.q}</div><div class="ova hidden">${a}</div><div class="ovbtns"><button class="btn reveal big ovshow">👀 Показати відповідь</button><button class="btn big ovx">Закрити ✕</button></div>`);
  $('.ovshow',OVC).onclick=()=>{$('.ova',OVC).classList.remove('hidden');$('.ovshow',OVC).classList.add('hidden');sfx.ok();};
  sfx.click();
}
$('#bNext').onclick=next;$('#bBack').onclick=back;$('#bReset').onclick=resetBiome;
$('#bReveal').onclick=revealAnswer;$('#bThink').onclick=showThink;$('#bFast').onclick=showFast;

/* overlay */
const OV=$('#ov'),OVC=$('#ovCard');let ovPrimary=null,ovClosable=true;
function openOv(html,{cls='',primary=null,closable=true}={}){OVC.className='card '+cls;OVC.innerHTML=html;OV.classList.remove('hidden');ovPrimary=primary;ovClosable=closable;const x=$('.ovx',OVC);if(x)x.onclick=closeOv;}
function closeOv(){OV.classList.add('hidden');OVC.innerHTML='';ovPrimary=null;}
OV.addEventListener('click',e=>{if(e.target===OV&&ovClosable)closeOv();});
let toastT=0;
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.remove('hidden','show');void t.offsetWidth;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),2600);}

addEventListener('keydown',e=>{
  if(!OV.classList.contains('hidden')){
    if(e.key==='Escape'&&ovClosable)closeOv();
    else if((e.key==='ArrowRight'||e.key==='Enter')&&ovPrimary){e.preventDefault();ovPrimary();}
    else if(e.key==='ArrowRight'&&ovClosable){e.preventDefault();closeOv();}
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();back();}
  else if(e.code==='KeyR'){resetBiome();}
  else if(e.key==='Enter'&&S.screen==='start'){e.preventDefault();startGame();}
});

/* ---------------- карта подорожі ---------------- */
const TW=164,TH=152,TRAV_OFF=(TW-48)/2;let tileX=()=>0;
function buildMap(){
  const tr=$('#track'),W=tr.clientWidth||1398,gap=(W-7*TW)/6;tileX=i=>Math.round(i*(TW+gap));
  const kinds=['forest','desert','taiga','swamp','savanna','mount','tower'],names=[...BIOMES.map(b=>b.name),'Вежа Чарівника'];
  let svg='';for(let i=0;i<6;i++){const x1=tileX(i)+TW-4,x2=tileX(i+1)+4,y=6+TH-34,len=x2-x1;
    svg+=`<line class="pbase" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="plit" id="pl${i}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" data-len="${len}" style="stroke-dasharray:${len};stroke-dashoffset:${len}"/>`;}
  $('#paths').innerHTML=svg;
  kinds.forEach((k,i)=>{const t=document.createElement('div');t.className='tile'+(k==='tower'?' tower':'');t.style.left=tileX(i)+'px';
    t.innerHTML=`<img class="pix scene" src="${scene(k)}" alt=""><div class="tlabel">${names[i]}</div>${k==='tower'?'<div class="fog"><span>?</span></div>':''}`;tr.appendChild(t);});
  const m=document.createElement('div');m.id='mtrav';m.innerHTML=`<img class="pix" src="${spr('trav')}" alt="">`;tr.appendChild(m);
}
function updateMap(){
  const c=S.screen==='final'?6:S.b;
  $$('#track .tile').forEach((t,i)=>{t.classList.toggle('done',i<c);t.classList.toggle('cur',i===c&&S.screen!=='final');t.classList.toggle('locked',i>c);});
  $$('#paths .plit').forEach((l,i)=>{l.style.transition='none';l.style.strokeDashoffset=i<c?0:l.dataset.len;});
  $('#mtrav').style.left=(tileX(c)+TRAV_OFF)+'px';
  $('#journey').classList.toggle('clear',S.screen==='final');
}
async function walkMap(from,to){
  const m=$('#mtrav'),x0=tileX(from)+TRAV_OFF,x1=tileX(to)+TRAV_OFF,line=$('#pl'+from),len=+line.dataset.len;let lastStep=-1;
  line.style.transition='none';
  await tween(2400,(e,t)=>{m.style.left=(x0+(x1-x0)*e)+'px';m.style.transform=`translateY(${-Math.abs(Math.sin(t*Math.PI*9))*12}px)`;line.style.strokeDashoffset=len*(1-e);
    const st=Math.floor(t*9);if(st!==lastStep){lastStep=st;sfx.step();}},t=>t);
  m.style.transform='';
  $$('#track .tile')[to].classList.remove('locked');
}

/* ---------------- рюкзак ---------------- */
function buildBackpack(){$('#bpSlots').innerHTML=BIOMES.map((b,i)=>`<div class="slot" data-i="${i}"><span class="qm">?</span></div>`).join('');}
function fillSlot(i){const R=BIOMES[i].reward,s=$$('#bpSlots .slot')[i];s.classList.add('on','pop');s.innerHTML=`${img(R.spr,50)}<b${R.en.length>8?' class="long"':''}>${R.en}</b><i>${R.ua}</i>`;}
$('#bpSlots').addEventListener('click',e=>{const s=e.target.closest('.slot.on');if(!s||S.busy)return;const R=BIOMES[+s.dataset.i].reward;
  openOv(`<img class="pix rwicon" src="${spr(R.spr)}" alt=""><div class="rwword">${R.en}<button class="speak" data-say="${R.say}">🔊</button></div><div class="rwua">${R.ua}</div><button class="btn big ovx">Закрити ✕</button>`,{cls:'reward'});});
function showReward(i){
  const R=BIOMES[i].reward;
  return new Promise(res=>{
    let done=false;
    const go=async()=>{
      if(done)return;done=true;
      const icon=$('.rwicon',OVC),from=stageRect(icon),slot=$$('#bpSlots .slot')[i],to=stageRect(slot);closeOv();
      const fl=document.createElement('img');fl.src=spr(R.spr);fl.className='pix flyer';STAGE.appendChild(fl);sfx.whoosh();
      const tx=to.x+to.w/2-28,ty=to.y+to.h/2-40;
      await tween(950,e=>{const s=from.w+(56-from.w)*e;fl.style.width=fl.style.height=s+'px';fl.style.left=(from.x+(tx-from.x)*e)+'px';fl.style.top=(from.y+(ty-from.y)*e-Math.sin(e*Math.PI)*160)+'px';});
      fl.remove();fillSlot(i);sfx.coin();await sleep(350);res();
    };
    openOv(`<div class="ovh">🎁 Нагорода біома «${BIOMES[i].name}»!</div><img class="pix rwicon" src="${spr(R.spr)}" alt=""><div class="rwword">${R.en}<button class="speak" data-say="${R.say}">🔊</button></div><div class="rwua">${R.ua}</div><button class="btn next huge rwgo">🎒 У рюкзак!</button>`,{cls:'reward',primary:go,closable:false});
    $('.rwgo',OVC).onclick=go;sfx.reward();setTimeout(()=>speakAuto(R.say),700);
  });
}
async function completeBiome(){
  if(S.busy||S.screen!=='play')return;S.busy=true;closeOv();
  const i=S.b;await showReward(i);
  if(i<5){
    await walkMap(i,i+1);S.b++;S.q=0;S.bs={};S.busy=false;render();sfx.coin();toast(`${BIOMES[S.b].icon} Біом ${S.b+1}: ${BIOMES[S.b].name}!`);
  }else{
    token++;await walkMap(5,6);$('#journey').classList.add('clear');sfx.win();await sleep(1300);
    S.screen='final';S.busy=false;showFinal();confetti();
  }
}

/* ---------------- екрани ---------------- */
function showStart(){
  S.screen='start';$('#play').classList.add('hidden');const sc=$('#screen');sc.classList.remove('hidden');
  sc.innerHTML=`<div class="start"><div class="sart"><img class="pix" src="${spr('trav')}" style="width:150px;height:200px" alt=""><img class="pix" src="${towerBig()}" style="width:160px;height:280px;opacity:.8;filter:blur(1.5px)" alt=""></div>
   <div class="stext"><h1>Подорож до Вежі Чарівника</h1><p>Мандрівники Академії вирушають у дорогу! Шлях іде через <b>6 біомів</b>. У кожному — випробування. Пройдемо всі — і дістанемося <b>Вежі Чарівника</b>!</p>
   <button class="btn next huge" id="bStart">▶ Вирушаємо!</button>
   <div class="thelp">Для викладача: <b>→</b> далі · <b>←</b> назад · <b>R</b> скинути біом · 🤔 питання для класу · 👀 відповідь · ⚡ для швидких</div></div></div>`;
  $('#bStart').onclick=startGame;updateMap();
}
function startGame(){if(S.screen!=='start')return;AC();S.screen='play';$('#screen').classList.add('hidden');$('#play').classList.remove('hidden');sfx.ok();render();}
function showFinal(){
  $('#play').classList.add('hidden');const sc=$('#screen');sc.classList.remove('hidden');
  sc.innerHTML=`<div class="final"><div class="ftower"><img class="pix" src="${towerBig()}" alt=""></div><div class="ftext">
    <h1>🏆 Ви дісталися Вежі!<br>Справжні мандрівники Академії!</h1><h2>Що ми сьогодні вміємо:</h2>
    <ul>${SKILLS.map((s,i)=>`<li style="animation-delay:${.3+i*.25}s">${s}</li>`).join('')}</ul>
    <button class="btn next big" id="bAgain">🔁 Нова подорож</button></div></div>`;
  $('#bAgain').onclick=restart;updateMap();
}
function restart(){
  S.b=0;S.q=0;S.bs={};S.busy=false;S.solved=BIOMES.map(b=>b.questions.map(()=>false));buildBackpack();$('#journey').classList.remove('clear');showStart();
}
function confetti(ms=6500){
  const cv=$('#confetti'),x=cv.getContext('2d'),cols=['#ffd23f','#ff3b3b','#4fd16a','#4aa8ff','#a66bff','#ff9a2e','#ffffff'],P=[];
  for(let i=0;i<280;i++)P.push({x:Math.random()*1920,y:-Math.random()*1000,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:10+Math.random()*12,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.2});
  const t0=performance.now();cv.style.display='block';
  (function f(now){x.clearRect(0,0,1920,1080);let alive=false;
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.r+=p.vr;
      if(p.y>1100&&now-t0<ms){p.y=-20;p.x=Math.random()*1920;p.vy=2+Math.random()*4;}
      if(p.y<1100)alive=true;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore();});
    if(alive)requestAnimationFrame(f);else{x.clearRect(0,0,1920,1080);cv.style.display='none';}})(t0);
}

/* ---------------- старт ---------------- */
buildMap();buildBackpack();showStart();
</script>
